<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>配音工作台</title>
<style>
:root {
  --bg: #0b1020; --panel: #121a30; --panel2: #18223d; --line: #26324f; --fg: #e6ecff; --dim: #8a96b8;
  --acc: #60a5fa; --ok: #34d399; --warn: #fbbf24; --bad: #fb7185;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--acc); }
button:disabled { opacity: .45; cursor: default; }
button.pri { background: #1d4ed8; border-color: #3b82f6; }
button:focus-visible, textarea:focus-visible, input:focus-visible, .cue:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
kbd { font: 12px ui-monospace, monospace; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

#app { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; }
#left { display: flex; flex-direction: column; min-width: 0; padding: 12px 12px 8px; gap: 8px; }
#view { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#frameBox { position: relative; aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%; width: 100%; background: #000; border-radius: 6px; overflow: hidden; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#busy { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 8, 18, .72); font-size: 18px; }
#bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#time { font: 13px ui-monospace, monospace; color: var(--dim); min-width: 120px; }
#bar .sp { flex: 1; }
#bar label { color: var(--dim); display: flex; align-items: center; gap: 4px; }

#tline { position: relative; height: 46px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; overflow: hidden; }
#tline .c { position: absolute; top: 14px; height: 24px; background: #2b3a63; border-radius: 2px; }
#tline .c.sel { background: var(--acc); }
#tline .c.mod { background: var(--warn); }
#tline .ch { position: absolute; top: 0; bottom: 0; width: 1px; background: #4b5a85; }
#tline .ch span { position: absolute; top: 0; left: 3px; font-size: 10px; color: var(--dim); white-space: nowrap; }
#tline .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); pointer-events: none; }

#right { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
#ed { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; max-height: 62vh; overflow: auto; }
#ed h2 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
#ed h2 small { color: var(--dim); font-weight: normal; }
#ed label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 2px; }
#ed textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
#ed .spoken { font-size: 12px; color: var(--dim); background: var(--bg); border-radius: 6px; padding: 4px 8px; }
#ed .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#ed input[type=number] { width: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
#msg { font-size: 12px; white-space: pre-wrap; }
#msg.err { color: var(--bad); } #msg.ok { color: var(--ok); }
#takes { display: flex; flex-direction: column; gap: 4px; }
.take { display: flex; gap: 6px; align-items: center; font-size: 12px; background: var(--bg); border-radius: 6px; padding: 4px 6px; }
.take.cur { outline: 1px solid var(--ok); }
.take .tx { flex: 1; min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.take button { padding: 1px 8px; font-size: 12px; }

#list { flex: 1; overflow: auto; padding: 6px 0; }
.chap { padding: 10px 12px 4px; color: var(--warn); font-size: 12px; position: sticky; top: -6px; background: var(--panel); }
.cue { display: grid; grid-template-columns: 46px 52px 1fr; gap: 6px; padding: 5px 12px; cursor: pointer; border-left: 3px solid transparent; }
.cue:hover { background: var(--panel2); }
.cue .id { color: var(--dim); font: 12px ui-monospace, monospace; }
.cue .t { color: var(--dim); font: 12px ui-monospace, monospace; }
.cue.now { background: #16244a; }
.cue.sel { border-left-color: var(--acc); background: #1a2a55; }
.cue.mod .id::after { content: " ●"; color: var(--warn); }
#help { padding: 6px 12px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="view"><div id="frameBox"><iframe id="frame" title="动画预览"></iframe><div id="busy" hidden>…</div></div></div>
    <div id="tline" role="slider" aria-label="时间线" tabindex="0"></div>
    <div id="bar">
      <button id="play" class="pri">▶ 播放</button>
      <button id="playCue">试听本句</button>
      <span id="time">0:00.0 / 0:00</span>
      <label><input type="checkbox" id="follow" checked> 列表跟随</label>
      <span class="sp"></span>
      <span id="rstat"></span>
      <button id="render">导出预览（960×540）</button>
    </div>
  </div>
  <div id="right">
    <div id="ed">
      <h2><span id="eId">—</span><small id="eInfo"></small></h2>
      <div>
        <label for="eText">字幕（屏幕上显示的文字）</label>
        <textarea id="eText" rows="3"></textarea>
      </div>
      <div id="segmentsBox" hidden>
        <label for="eSegments">字幕分段（每行一段，保持原有段数与顺序）</label>
        <textarea id="eSegments" rows="4"></textarea>
      </div>
      <div>
        <label for="eTts">朗读文本（可选，留空则按字幕朗读，比如把 200×80 写成"两百乘八十"）</label>
        <textarea id="eTts" rows="2"></textarea>
        <div class="spoken" id="eSpoken"></div>
      </div>
      <div>
        <label for="eStyle">本句语气（可选，追加在全局风格之后）</label>
        <textarea id="eStyle" rows="1" placeholder="例如：语速放慢，强调最后几个字"></textarea>
      </div>
      <div class="row">
        <label for="eGap" style="margin:0">句后停顿</label><input id="eGap" type="number" step="0.1" min="0" max="5"> 秒
      </div>
      <div class="row">
        <button id="regen" class="pri">重新生成 <kbd>R</kbd></button>
        <button id="save">保存修改</button>
        <button id="revert">还原输入</button>
      </div>
      <div>
        <label for="audioFile">替换本句音频（WAV、MP3、M4A，不超过 50 MB）</label>
        <input id="audioFile" type="file" accept="audio/*,.wav,.mp3,.m4a">
        <button id="upload">导入并使用</button>
        <div class="spoken">导入前请先保存文案修改。旧录音保留在历史版本中。</div>
      </div>
      <div id="msg" role="status" aria-live="polite"></div>
      <div><label>历史版本</label><div id="takes"></div></div>
    </div>
    <div id="list" role="listbox" aria-label="全部台词"></div>
    <div id="help"><kbd>空格</kbd> 播放/暂停 · <kbd>↑</kbd><kbd>↓</kbd> 上/下一句 · <kbd>Enter</kbd> 试听本句 · <kbd>R</kbd> 重新生成</div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const frame = $('#frame');
let S = null;                 // server state: cues, timing, takes, render
let TM = null, byId = {};     // timing + cue lookup (timing entries merged with script entries)
let sel = null;               // selected cue id
const modified = new Set();   // cues changed in this session

// ---------- speakable (mirror of tools/tts.py, for a live preview only) ----------
function speakable(s) {
  const en = S?.language === 'en-US';
  return s.replace(/(?<=\d)\.(?=\d)/g, en ? ' point ' : '点')
    .replace(/(?<=[A-Za-z0-9_)\]])\.(?=[A-Za-z])/g, en ? ' dot ' : ' 点 ')
    .replace(/(?<![A-Za-z0-9])\.(?=[A-Za-z])/g, en ? 'dot ' : '点 ')
    .replace(/(?<=[a-z])(?=[A-Z])/g, ' ')
    .replace(/(?<=[A-Z])(?=[A-Z][a-z])/g, ' ')
    .replace(/ {2,}/g, ' ');
}

// ---------- api ----------
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function busy(text) { $('#busy').hidden = !text; $('#busy').textContent = text || ''; }
function msg(text, cls = '') { $('#msg').textContent = text; $('#msg').className = cls; }

// ---------- audio engine: Web Audio clock drives the animation ----------
const ctx = new AudioContext();
const bufs = new Map();      // file -> Promise<AudioBuffer>
let playing = false, t0ctx = 0, t0 = 0, stopAt = null, srcs = [], scheduled = new Set(), headT = 0;
function buf(file) {
  if (!bufs.has(file)) bufs.set(file, fetch(S.audioBase + file).then((r) => r.arrayBuffer()).then((b) => ctx.decodeAudioData(b)));
  return bufs.get(file);
}
const now = () => (playing ? t0 + (ctx.currentTime - t0ctx) : headT);
function schedule() {
  const t = now();
  for (const c of TM.cues) {
    const dur = c.voiceEnd - c.start + 0.5;
    if (scheduled.has(c.id) || c.start + dur < t || c.start > t + 8) continue;
    scheduled.add(c.id);
    buf(c.file).then((b) => {
      if (!playing || !scheduled.has(c.id)) return;
      const tt = now(), off = Math.max(0, tt - c.start);
      if (off >= b.duration) return;
      const s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination);
      s.start(ctx.currentTime + Math.max(0, c.start - tt), off);
      srcs.push(s);
    });
  }
}
async function play(from = headT, until = null) {
  await ctx.resume();
  stop();
  t0 = from; t0ctx = ctx.currentTime + 0.05; stopAt = until; playing = true;
  schedule();
  $('#play').textContent = '⏸ 暂停';
}
function stop() {
  if (playing) headT = now();
  playing = false; stopAt = null; scheduled.clear();
  srcs.forEach((s) => { try { s.stop(); } catch (e) {} }); srcs = [];
  $('#play').textContent = '▶ 播放';
}
function seek(t) {
  const was = playing && stopAt == null;
  stop(); headT = Math.max(0, Math.min(TM.duration, t)); draw();
  if (was) play(headT);
}
function playCue(id) {
  const c = TM.cues.find((c) => c.id === id); if (!c) return;
  headT = c.start; play(c.start, c.voiceEnd + 0.4);
}
// audition a take file without applying it
let auditionSrc = null;
async function audition(file) {
  await ctx.resume(); stop();
  if (auditionSrc) try { auditionSrc.stop(); } catch (e) {}
  const s = ctx.createBufferSource(); s.buffer = await buf(file); s.connect(ctx.destination); s.start(); auditionSrc = s;
}

// ---------- drawing ----------
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
let lastNow = null;
function draw() {
  const t = now();
  const w = frame.contentWindow;
  if (w && w.seek) try { w.seek(t); } catch (e) {}
  $('#time').textContent = `${fmt(t)} / ${fmt(TM.duration)}`;
  $('#tline .ph').style.left = (t / TM.duration * 100) + '%';
  const cur = TM.cues.find((c) => t >= c.start && t < c.voiceEnd + 0.3);
  const id = cur ? cur.id : null;
  if (id !== lastNow) {
    document.querySelectorAll('.cue.now').forEach((e) => e.classList.remove('now'));
    if (id) {
      const e = document.querySelector(`.cue[data-id="${id}"]`);
      e.classList.add('now');
      if (playing && $('#follow').checked) e.scrollIntoView({ block: 'nearest' });
    }
    lastNow = id;
  }
}
function loop() {
  if (playing) {
    schedule();
    if (stopAt != null && now() >= stopAt) { stop(); }
    else if (now() >= TM.duration) { stop(); headT = 0; }
  }
  if (TM) draw();
  requestAnimationFrame(loop);
}

// ---------- building the UI ----------
function buildTimeline() {
  const tl = $('#tline'); tl.innerHTML = '';
  for (const ch of TM.chapters) {
    const d = document.createElement('div'); d.className = 'ch'; d.style.left = (ch.t0 / TM.duration * 100) + '%';
    d.innerHTML = `<span>${ch.num}</span>`; tl.appendChild(d);
  }
  for (const c of TM.cues) {
    const d = document.createElement('div'); d.className = 'c'; d.dataset.id = c.id;
    d.style.left = (c.voiceStart / TM.duration * 100) + '%';
    d.style.width = Math.max(0.08, (c.voiceEnd - c.voiceStart) / TM.duration * 100) + '%';
    d.title = `${c.id} ${c.text}`; tl.appendChild(d);
  }
  const ph = document.createElement('div'); ph.className = 'ph'; tl.appendChild(ph);
  markSel();
}
function buildList() {
  const L = $('#list'); const top = L.scrollTop; L.innerHTML = '';
  const tm = Object.fromEntries(TM.cues.map((c) => [c.id, c]));
  for (const c of S.cues) {
    if (c.chapter) { const h = document.createElement('div'); h.className = 'chap'; h.textContent = `${c.chapter} · ${c.name}`; L.appendChild(h); continue; }
    if (!c.text) continue;
    const d = document.createElement('div'); d.className = 'cue'; d.dataset.id = c.id; d.tabIndex = -1; d.setAttribute('role', 'option');
    d.innerHTML = `<span class="id"></span><span class="t"></span><span class="x"></span>`;
    d.querySelector('.id').textContent = c.id;
    d.querySelector('.t').textContent = tm[c.id] ? fmt(tm[c.id].start) : '';
    d.querySelector('.x').textContent = c.text;
    d.onclick = () => { select(c.id); seek(tm[c.id].start); };
    d.ondblclick = () => playCue(c.id);
    L.appendChild(d);
  }
  L.scrollTop = top; lastNow = null; markSel();
}
function markSel() {
  document.querySelectorAll('.cue').forEach((e) => { e.classList.toggle('sel', e.dataset.id === sel); e.classList.toggle('mod', modified.has(e.dataset.id)); });
  document.querySelectorAll('#tline .c').forEach((e) => { e.classList.toggle('sel', e.dataset.id === sel); e.classList.toggle('mod', modified.has(e.dataset.id) && e.dataset.id !== sel); });
}
function fillEditor() {
  const c = byId[sel]; if (!c) return;
  const t = TM.cues.find((x) => x.id === sel);
  $('#eId').textContent = sel;
  $('#eInfo').textContent = t ? `${S.language === 'en-US' ? '英文' : '中文'} · ${fmt(t.start)} · 语音 ${(t.voiceEnd - t.voiceStart).toFixed(2)} 秒${c.take ? ' · 第 ' + c.take + ' 版' : ''}` : '';
  $('#eText').value = c.text; $('#eTts').value = c.tts || ''; $('#eStyle').value = c.style || ''; $('#eGap').value = c.gap ?? 0.4;
  $('#segmentsBox').hidden = !c.segments;
  $('#eSegments').value = (c.segments || []).map((s) => s.trim()).join('\n');
  updateSpoken();
  const T = $('#takes'); T.innerHTML = '';
  const list = (S.takes[sel] || []).slice().reverse();
  for (const e of list) {
    const d = document.createElement('div'); d.className = 'take' + (e.file === c.file ? ' cur' : '');
    d.innerHTML = `<span></span><span class="tx"></span><button>试听</button>${e.file === c.file ? '<span style="color:var(--ok)">使用中</span>' : '<button>用这一版</button>'}`;
    d.firstChild.textContent = `${e.at} · ${e.duration.toFixed(2)}s${e.audio ? ' · 导入' : ''}`;
    d.querySelector('.tx').textContent = e.tts || e.text; d.querySelector('.tx').title = (e.tts || e.text) + (e.style ? `\n语气：${e.style}` : '');
    const [bPlay, bUse] = d.querySelectorAll('button');
    bPlay.onclick = () => audition(e.file);
    if (bUse) bUse.onclick = () => run('/api/select', { id: sel, file: e.file }, '切换版本，重新对齐时间线…');
    T.appendChild(d);
  }
  if (!list.length) T.textContent = '（无）';
}
function updateSpoken() { $('#eSpoken').textContent = '实际朗读：' + speakable($('#eTts').value.trim() || $('#eText').value.trim()); }
function select(id) {
  sel = id; fillEditor(); markSel(); msg('');
  const e = document.querySelector(`.cue[data-id="${id}"]`); if (e) e.scrollIntoView({ block: 'nearest' });
}
function edits() {
  const e = { id: sel, text: $('#eText').value, tts: $('#eTts').value, style: $('#eStyle').value, gap: parseFloat($('#eGap').value) || 0 };
  if (byId[sel].segments) {
    const lines = $('#eSegments').value.split('\n').map((s) => s.trim());
    e.segments = lines.map((s, i) => s + (i < lines.length - 1 ? ' ' : ''));
  }
  return e;
}
function dirty() { const c = byId[sel], e = edits(); return e.text.trim() !== c.text || e.tts.trim() !== (c.tts || '') || e.style.trim() !== (c.style || '') || e.gap !== (c.gap ?? 0.4) || (c.segments && JSON.stringify(e.segments) !== JSON.stringify(c.segments)); }

// ---------- server round trips ----------
function applyState(st) {
  S = st; TM = st.timing; byId = Object.fromEntries(st.cues.filter((c) => c.text).map((c) => [c.id, c]));
  document.title = `${st.language === 'en-US' ? '英文' : '中文'}配音工作台 · ${st.video}`;
  // timing entries carry the file actually used for playback
  buildTimeline(); buildList(); if (sel) fillEditor(); renderStatus(st.render);
}
function reloadFrame() {
  return new Promise((res) => {
    frame.onload = () => {
      const w = frame.contentWindow;
      if (!w.DURATION) msg('动画预览加载失败，请检查脚本后重试。', 'err');
      res();
    };
    frame.src = S.animationUrl + '?v=' + Date.now();
  });
}
let running = false;
async function run(path, body, text, force = false) {
  if (running) return; running = true;
  const id = body.id, oldStart = TM.cues.find((c) => c.id === id)?.start ?? headT;
  const rel = headT - oldStart;
  stop(); busy(text); msg(''); setButtons(false);
  try {
    let st;
    if (path === '/api/upload') {
      const r = await fetch(path + '?id=' + encodeURIComponent(id), { method: 'POST', body: body.file });
      st = await r.json(); if (!r.ok) throw new Error(st.error || '导入失败');
    } else st = await api(path, force ? { ...body, force: true } : body);
    modified.add(id);
    applyState(st);
    await reloadFrame();
    const nc = TM.cues.find((c) => c.id === id);
    headT = nc.start + Math.max(0, rel);
    msg(`完成。${id} 现在 ${(nc.voiceEnd - nc.voiceStart).toFixed(2)} 秒，全片 ${fmt(TM.duration)}`, 'ok');
    busy(''); playCue(id);
  } catch (e) {
    busy('');
    if (!force && /动画里引用了这些关键词/.test(e.message)) {
      msg(e.message, 'err');
      const b = document.createElement('button'); b.textContent = '仍然保存（动画可能报错）';
      b.onclick = () => { running = false; run(path, body, text, true); };
      $('#msg').appendChild(document.createElement('br')); $('#msg').appendChild(b);
    } else msg(e.message, 'err');
  } finally { running = false; setButtons(true); }
}
function setButtons(on) { ['#regen', '#save', '#render', '#upload'].forEach((s) => ($(s).disabled = !on)); }

// ---------- export ----------
let rTimer = null;
function renderStatus(r) {
  const el = $('#rstat');
  if (r.state === 'running') {
    const last = (r.log.trim().split('\n').pop() || '').slice(0, 60);
    el.textContent = `导出中 ${Math.round((Date.now() / 1000 - r.started))} 秒 · ${last}`; el.style.color = 'var(--warn)';
    $('#render').disabled = true;
    if (!rTimer) rTimer = setInterval(async () => renderStatus((await api('/api/render')).render), 3000);
  } else {
    clearInterval(rTimer); rTimer = null; $('#render').disabled = false;
    el.textContent = r.state === 'done' ? `已导出 ${r.out}` : r.state === 'failed' ? '导出失败：' + (r.log.trim().split('\n').pop() || '') : '';
    el.style.color = r.state === 'failed' ? 'var(--bad)' : 'var(--ok)';
  }
}

// ---------- events ----------
$('#play').onclick = () => (playing ? stop() : play(headT));
$('#playCue').onclick = () => sel && playCue(sel);
$('#regen').onclick = () => sel && run('/api/edit', { ...(dirty() ? edits() : { id: sel }), newTake: true }, `正在重新生成 ${sel}…`);
$('#save').onclick = () => sel && (dirty() ? run('/api/edit', edits(), `正在保存并生成 ${sel}…`) : msg('没有改动'));
$('#revert').onclick = () => { fillEditor(); msg(''); };
$('#upload').onclick = () => {
  if (!sel) return;
  if (dirty()) return msg('请先保存文案修改，再导入音频。', 'err');
  const file = $('#audioFile').files[0];
  if (!file) return msg('请先选择音频文件。', 'err');
  if (file.size > 50 * 1024 * 1024) return msg('请选择不超过 50 MB 的音频文件。', 'err');
  run('/api/upload', { id: sel, file }, '正在导入音频并调整时间线…');
};
$('#render').onclick = async () => { try { renderStatus((await api('/api/render', { w: 960, jobs: 8 })).render); } catch (e) { msg(e.message, 'err'); } };
['#eText', '#eTts'].forEach((s) => $(s).addEventListener('input', updateSpoken));
const tlEl = $('#tline');
const tlTime = (ev) => { const r = tlEl.getBoundingClientRect(); return (ev.clientX - r.left) / r.width * TM.duration; };
tlEl.addEventListener('pointerdown', (ev) => {
  tlEl.setPointerCapture(ev.pointerId); seek(tlTime(ev));
  const mv = (e) => seek(tlTime(e)); tlEl.addEventListener('pointermove', mv);
  tlEl.addEventListener('pointerup', () => {
    tlEl.removeEventListener('pointermove', mv);
    const t = now(), c = TM.cues.find((c) => t >= c.start && t < c.voiceEnd + 0.3); if (c) select(c.id);
  }, { once: true });
});
tlEl.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') seek(now() - 2); if (e.key === 'ArrowRight') seek(now() + 2); });
addEventListener('keydown', (e) => {
  if (e.target.closest('textarea, input')) { if (e.key === 'Escape') e.target.blur(); return; }
  const ids = TM.cues.map((c) => c.id), i = ids.indexOf(sel);
  if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(headT); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); const n = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    select(n); seek(TM.cues.find((c) => c.id === n).start);
  } else if (e.key === 'Enter') { e.preventDefault(); sel && playCue(sel); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); $('#regen').click(); }
});

(async function init() {
  busy('加载中…');
  applyState(await api('/api/state'));
  await reloadFrame();
  select(TM.cues[0].id); busy('');
  requestAnimationFrame(loop);
})();
</script>
